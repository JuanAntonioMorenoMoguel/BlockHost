import org.gradle.internal.os.OperatingSystem

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.runtime' version '1.13.1'
}

group = 'com.blockhost'
version = '0.2.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Los datos de la app (caché, servidores) van a build/ y no a la carpeta real del usuario.
    def data = layout.buildDirectory.dir('test-data').get().asFile
    systemProperty 'user.home', data
    environment 'XDG_DATA_HOME', data
    environment 'APPDATA', data
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

javafx {
    version = '21.0.5'
    modules = ['javafx.controls']
}

application {
    // Launcher no extiende Application: así JavaFX funciona desde el classpath y en el instalador.
    mainClass = 'com.blockhost.Launcher'
    applicationName = 'BlockHost'
}

// ./gradlew installer  ->  build/jpackage/BlockHost-<versión>.exe  (instalador de Windows con Java incluido)
runtime {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    modules = ['java.base', 'java.desktop', 'java.logging', 'java.management', 'jdk.management',
               'java.net.http', 'jdk.crypto.ec', 'jdk.unsupported', 'java.scripting', 'jdk.jfr', 'jdk.zipfs']

    jpackage {
        imageName = 'BlockHost'
        installerName = 'BlockHost'
        appVersion = project.version
        if (OperatingSystem.current().isWindows()) installerType = 'exe'
        installerOptions += ['--vendor', 'BlockHost', '--description', 'Servidores de Minecraft en tu PC']
        // Sin --win-console: BlockHost.exe abre solo la ventana de la app, sin consola detrás.
        if (OperatingSystem.current().isWindows()) {
            imageOptions += ['--icon', file('packaging/icon.ico').path]
        } else if (OperatingSystem.current().isLinux()) {
            imageOptions += ['--icon', file('packaging/icon.png').path]
        }
        if (OperatingSystem.current().isWindows()) {
            // Necesita WiX Toolset 3 (https://github.com/wixtoolset/wix3/releases). Instalación por usuario: sin
            // pedir permisos de administrador. El UUID fijo hace que una versión nueva sustituya a la anterior.
            installerOptions += ['--win-dir-chooser', '--win-menu', '--win-menu-group', 'BlockHost', '--win-shortcut',
                                 '--win-shortcut-prompt', '--win-per-user-install',
                                 '--win-upgrade-uuid', '6f1d9a3e-4b7c-4f2a-9d55-0b8f3c2e7a41']
        }
    }
}

// ./gradlew app  ->  build/jpackage/BlockHost/ con BlockHost.exe: se abre con doble clic, sin consola
// y sin necesitar Java instalado. Esa carpeta se puede copiar a donde quieras.
tasks.register('app') {
    group = 'distribution'
    description = 'Genera la app portable (BlockHost.exe en Windows) sin consola.'
    dependsOn 'jpackageImage'
    doLast {
        def dir = layout.buildDirectory.dir('jpackage/BlockHost').get().asFile
        def exe = OperatingSystem.current().isWindows() ? new File(dir, 'BlockHost.exe') : dir
        println "\nApp lista: ${exe}\nÁbrela con doble clic (puedes anclarla a la barra de tareas o crear un acceso directo)."
    }
}

// ./gradlew installer  ->  instalador de Windows (BlockHost-<versión>.exe): asistente de instalación, entrada en el
// menú Inicio, acceso directo en el escritorio y desinstalación desde «Aplicaciones». Requiere WiX Toolset 3.
tasks.register('installer') {
    group = 'distribution'
    description = 'Genera el instalador de Windows (.exe) con Java incluido.'
    dependsOn 'jpackage'
    doLast {
        def dir = layout.buildDirectory.dir('jpackage').get().asFile
        def files = dir.listFiles().findAll { it.isFile() && (it.name.endsWith('.exe') || it.name.endsWith('.msi')
                || it.name.endsWith('.deb') || it.name.endsWith('.rpm') || it.name.endsWith('.dmg')) }
        println "\nInstalador listo: ${files.join(', ')}"
    }
}
